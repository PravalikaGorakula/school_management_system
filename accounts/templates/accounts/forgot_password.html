{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | SMS
    </title>


    <link
        rel="stylesheet"
        href="{% static 'accounts/css/auth.css' %}"
    >

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-logo">
            SMS
        </div>


        <h1 class="auth-title">
            Forgot Password?
        </h1>


        <p class="auth-description">

            Enter the email address associated with
            your account. We will send you instructions
            to reset your password.

        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="auth-form-group">


                <label
                    for="id_email"
                    class="auth-label"
                >
                    Email Address
                </label>


                <input
                    type="email"
                    id="id_email"
                    name="email"
                    class="auth-input"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >


            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Send Reset Instructions
            </button>


        </form>


        <a
            href="{% url 'accounts:login' %}"
            class="auth-back-link"
        >
            ← Back to Login
        </a>


    </div>


</div>


<script
    src="{% static 'accounts/js/auth.js' %}"
></script>


</body>

</html>
