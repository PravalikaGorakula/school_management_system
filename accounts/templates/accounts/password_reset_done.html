{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Email Sent | SMS
    </title>


    <link
        rel="stylesheet"
        href="{% static 'accounts/css/auth.css' %}"
    >

</head>


<body>


<div class="auth-page">


    <div class="auth-card"
         style="text-align:center;">


        <div class="auth-logo"
             style="margin-left:auto;margin-right:auto;">
            SMS
        </div>


        <h1 class="auth-title">

            Check Your Email

        </h1>


        <p class="auth-description">

            If an account exists with the email address
            you entered, we have sent instructions to
            reset your password.

        </p>


        <div class="auth-success">

            Please check your inbox and spam/junk folder
            for the password reset email.

        </div>


        <a
            href="{% url 'accounts:login' %}"
            class="auth-button"
            style="
                display:block;
                text-decoration:none;
                padding-top:16px;
            "
        >
            Back to Login
        </a>


    </div>


</div>


</body>

</html>
