{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Password Reset Complete | SMS
    </title>


    <link
        rel="stylesheet"
        href="{% static 'accounts/css/auth.css' %}"
    >

</head>


<body>


<div class="auth-page">


    <div
        class="auth-card"
        style="text-align:center;"
    >


        <div
            class="auth-logo"
            style="
                margin-left:auto;
                margin-right:auto;
            "
        >
            SMS
        </div>


        <div
            style="
                width:75px;
                height:75px;
                margin:0 auto 25px;
                border-radius:50%;
                background:#ECFDF5;
                color:#059669;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:35px;
                font-weight:800;
            "
        >
            ✓
        </div>


        <h1 class="auth-title">

            Password Reset Complete

        </h1>


        <p class="auth-description">

            Your password has been successfully changed.

            You can now sign in using your new password.

        </p>


        <a
            href="{% url 'accounts:login' %}"
            class="auth-button"
            style="
                display:block;
                text-decoration:none;
                padding-top:16px;
            "
        >
            Continue to Login
        </a>


    </div>


</div>


</body>

</html>
