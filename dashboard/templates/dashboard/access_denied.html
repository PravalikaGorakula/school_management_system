{% extends "dashboard/base.html" %}

{% block title %}
Access Denied
{% endblock %}

{% block content %}

<div style="
    padding:60px;
    text-align:center;
">

    <div style="
        width:70px;
        height:70px;
        margin:0 auto 20px;
        border-radius:50%;
        background:#FFF4E6;
        color:#D97706;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:28px;
    ">

        <i class="fa-solid fa-lock"></i>

    </div>

    <h2 style="
        color:#123B63;
        margin-bottom:8px;
    ">
        Access Denied
    </h2>

    <p style="
        color:#6B7280;
    ">
        {{ message }}
    </p>

    <a
        href="{% url 'dashboard:home' %}"
        style="
            display:inline-flex;
            margin-top:15px;
            padding:11px 20px;
            border-radius:8px;
            background:#123B63;
            color:white;
            text-decoration:none;
            font-weight:600;
        "
    >
        Back to Dashboard
    </a>

</div>

{% endblock %}
